<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MesaUp - Gar&ccedil;om Online</title>
<style>
  :root{
    --bg:#0E121E;--card:#252A3D;--card2:#171B29;--border:#454B62;--fg:#F6F5F2;--fg2:#b7bfd2;--muted:#78829a;--primary:#EA7711;--primary2:#FAA429;--red:#f05252;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
  .top{height:52px;background:#111725;border-bottom:1px solid rgba(234,119,17,.25);display:flex;align-items:center;justify-content:center;font-weight:900}
  .top span{color:var(--primary2)}
  .wrap{min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:18px}
  .card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.28)}
  .icon{font-size:34px;margin-bottom:10px}.title{font-size:20px;font-weight:900;margin-bottom:6px}.sub{font-size:13px;color:var(--fg2);line-height:1.6;margin-bottom:16px}
  .code{display:inline-flex;background:rgba(234,119,17,.12);border:1px solid rgba(250,164,41,.32);color:var(--primary2);font:700 13px ui-monospace,monospace;border-radius:99px;padding:6px 12px;margin-bottom:14px;word-break:break-all}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;text-decoration:none;font-weight:800;padding:10px 16px;cursor:pointer}
  .danger{color:var(--red)}.muted{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);z-index:10}
</style>
</head>
<body>
<div class="top">Mesa<span>Up</span></div>
<div class="wrap">
  <div class="card" id="statusCard">
    <div class="icon">&#128241;</div>
    <div class="title">Carregando Gar&ccedil;om Online...</div>
    <div class="sub">Aguarde um instante.</div>
  </div>
</div>
<script src="../cardapio/config.js"></script>
<script>
function getCodigo(){
  const params = new URLSearchParams(location.search);
  const fromQuery = params.get('c') || params.get('codigo') || params.get('loja');
  if (fromQuery) return fromQuery;
  const parts = location.pathname.split('/').filter(Boolean);
  const idx = parts.indexOf('garcom');
  return idx >= 0 ? (parts[idx + 1] || '') : '';
}
function cleanCodigo(v){
  return String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'').slice(0,64);
}
function setStatus({title, sub, icon='&#128241;', code='', danger=false}){
  document.getElementById('statusCard').innerHTML = `
    <div class="icon">${icon}</div>
    <div class="title ${danger ? 'danger' : ''}">${title}</div>
    ${code ? `<div class="code">${code}</div>` : ''}
    <div class="sub">${sub}</div>
    <button class="btn" onclick="location.reload()">Tentar novamente</button>
    <div class="muted">MesaUp - Gar&ccedil;om Online</div>`;
}
(async function init(){
  const cfg = window.MESAUP_CARDAPIO_CONFIG || {};
  const storageBase = String(cfg.storageBase || '').replace(/\/$/, '');
  const codigo = cleanCodigo(getCodigo());
  if (!codigo) {
    setStatus({title:'Codigo nao informado', sub:'Abra o Garcom Online pelo QR Code gerado no MesaUp.', icon:'&#9888;&#65039;', danger:true});
    return;
  }
  if (!storageBase || storageBase.includes('__MESAUP_SUPABASE_PROJECT_REF__')) {
    setStatus({title:'Garcom Online em configuracao', sub:'O leitor publico ja esta instalado. Falta configurar o Supabase Storage no config.js.', icon:'&#9881;&#65039;', code:codigo});
    return;
  }
  const url = `${storageBase}/${encodeURIComponent(codigo)}/garcom.html?v=${Date.now()}`;
  let html = '';
  try {
    const res = await fetch(url, { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    html = await res.text();
    if (!html || !html.includes('<html')) throw new Error('HTML invalido');
  } catch (err) {
    setStatus({title:'Garcom Online ainda nao publicado', sub:'Peca ao caixa para clicar em Publicar / Atualizar QR na aba Garcom Online do MesaUp.', icon:'&#128241;', code:codigo});
    return;
  }
  const frame = document.createElement('iframe');
  frame.title = 'Garcom Online MesaUp';
  frame.setAttribute('sandbox', 'allow-scripts');
  frame.srcdoc = html;
  document.body.appendChild(frame);
})();
</script>
</body>
</html>
